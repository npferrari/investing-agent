name: Trading bot

on:
  schedule:
    # Times below are UTC, off-the-hour to dodge GitHub's queue congestion at
    # :00/:15/:30/:45, and tuned for EDT (UTC-4, roughly mid-March to early
    # November):
    #   12:23 UTC -> 08:23 EDT (pre-open, LIGHT)  | 07:23 EST (pre-open)
    #   16:53 UTC -> 12:53 EDT (midday, LIGHT)    | 11:53 EST (still mid-session)
    #   23:23 UTC -> 19:23 EDT (FULL)             | 18:23 EST (see DST note below)
    #
    # The FULL slot's time is not a market-hours choice — it's Alpaca's
    # market-on-open (OPG) order acceptance window, verified live 2026-07-29:
    # OPG orders are only accepted "after 7:00pm and before 9:28am" ET. 19:23
    # EDT clears that by 23 minutes; the two LIGHT slots don't submit OPG
    # orders at all (stop-loss sweep fills are immediate DAY orders), so they
    # only need to land during/near market hours, which they do.
    #
    # GitHub Actions cron does not follow DST. During EST (winter), the FULL
    # slot fires at 18:23 ET — 37 minutes *before* the 7pm ET OPG window
    # opens, so brain-approved trades would bounce with a graceful REJECTED
    # (bot/execute.py catches this, per the live-verified fix — it no longer
    # crashes the run), not silently misbehave. Move this to "23 0 * * 1-5"
    # (00:23 UTC, i.e. 7:23pm EST) for the November-March window if that
    # bounce is worth avoiding; adjust back at the March DST change.
    - cron: "23 12 * * 1-5"
    - cron: "53 16 * * 1-5"
    - cron: "23 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        options:
          - light
          - full

# Queue overlapping runs instead of cancelling or running concurrently: two
# runs racing each other could both pass the "already held" check in
# bot/main.py before either submits an order, producing a duplicate buy.
concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check kill switch
        id: killswitch
        run: |
          if [ "${{ vars.TRADING_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KILL_SWITCH — repo variable TRADING_ENABLED is not 'true' (got '${{ vars.TRADING_ENABLED }}'). Skipping bot run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine run mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 23 * * 1-5" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=light" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bot.main --mode ${{ steps.mode.outputs.mode }}

      - name: Commit logs
        if: always() && steps.killswitch.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # One `git add -f` call per path, not one call for all four: a
          # single multi-pathspec `git add -f` fails atomically (and stages
          # NOTHING, not even the paths that did exist) the moment any one
          # pathspec doesn't match a file — verified live 2026-07-24.
          # logs/positions_state.json and logs/pending_fills.json don't exist
          # until the first real order is ever submitted, so every run before
          # that point was silently failing to commit journal.jsonl/
          # run_history.log too, masked by this step's own `2>/dev/null || true`.
          # logs/pending_fills.json (added 2026-07-25, alongside
          # execute.reconcile_pending_fills()) is what lets a FULL run's
          # overnight DAY orders survive being submitted on one ephemeral
          # runner and reconciled for their real fill/slippage on the next
          # run's fresh checkout — without committing it here, that state is
          # lost the moment this job's runner is torn down.
          git add -f logs/journal.jsonl 2>/dev/null || true
          git add -f logs/run_history.log 2>/dev/null || true
          git add -f logs/positions_state.json 2>/dev/null || true
          git add -f logs/pending_fills.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "Log bot run: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # git pull --rebase needs a clean working tree, so this only runs
          # after our own changes are committed — never before. .gitattributes
          # declares merge=union for logs/*.jsonl and logs/*.log, so a
          # concurrent run's appended lines merge cleanly on rebase instead
          # of conflicting. logs/positions_state.json has no merge=union
          # entry (a JSON object, not an append-only log — a line-union
          # merge would produce invalid JSON); the "concurrency" group above
          # already queues runs sequentially rather than racing them, so a
          # genuine conflict here should be rare, and if one happens the
          # rebase fails loudly (triggering the failure-issue step below)
          # rather than silently corrupting sleeve state. A rejected push
          # means another run landed between our pull and our push; retry
          # with a fresh pull --rebase up to 3 attempts total.
          git pull --rebase origin main
          attempt=1
          max_attempts=3
          while true; do
            if git push origin main; then
              echo "Pushed logs on attempt $attempt."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Push rejected after $max_attempts attempts — giving up."
              exit 1
            fi
            echo "Push rejected (attempt $attempt/$max_attempts) — pulling and retrying..."
            git pull --rebase origin main
            attempt=$((attempt + 1))
          done

      - name: Open issue on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "
          import json
          try:
              with open('logs/journal.jsonl') as f:
                  lines = [l for l in f if l.strip()]
              rec = json.loads(lines[-1])
              tb = rec.get('traceback', 'No traceback field in latest journal entry.')
          except Exception as e:
              tb = f'Could not read logs/journal.jsonl: {e}'
          with open('issue_traceback.txt', 'w') as f:
              f.write(tb)
          try:
              with open('logs/journal.jsonl') as f:
                  lines = [l.rstrip('\n') for l in f if l.strip()]
              recent = '\n'.join(lines[-20:]) or '(journal.jsonl is empty)'
          except Exception as e:
              recent = f'Could not read logs/journal.jsonl: {e}'
          with open('issue_recent_journal.txt', 'w') as f:
              f.write(recent)
          "
          printf 'Scheduled/manual run failed.\n\nRun: %s\n\n```\n' "$RUN_URL" > issue_body.md
          cat issue_traceback.txt >> issue_body.md
          printf '\n```\n\n<details><summary>Last 20 logs/journal.jsonl lines</summary>\n\n```\n' >> issue_body.md
          cat issue_recent_journal.txt >> issue_body.md
          printf '\n```\n\n</details>\n' >> issue_body.md
          gh issue create \
            --title "Trading bot run failed: $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body-file issue_body.md
